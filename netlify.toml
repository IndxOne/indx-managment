[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # supabase/migrations/*.sql contient l'URL du projet Supabase en clair
  # (référencée dans une tâche pg_cron) — valeur déjà publique (identique à
  # VITE_SUPABASE_URL, expédiée telle quelle dans le bundle JS client), mais
  # le scanner de secrets de Netlify la signale à tort car elle correspond à
  # une variable marquée "secret" sur ce site. Ce dossier n'est jamais servi
  # au navigateur (hors de `publish = "dist"`), l'exclure du scan est sans
  # risque et sans effet sur le contenu déployé.
  SECRETS_SCAN_OMIT_PATHS = "supabase/migrations/**"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Sécurité : CSP stricte (aucun script inline, cf. public/theme-init.js),
# anti-clickjacking, pas de fuite de referrer, capteurs désactivés.
# 'unsafe-inline' en style-src : nécessaire aux attributs style React.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"

# Fichiers fingerprintés par Vite : cache long, immuable (éco-conception :
# zéro re-téléchargement entre deux visites).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Toujours revalidés : sinon une mise à jour ne serait jamais détectée.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
