<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover permet à la PWA installée d'occuper tout l'écran ;
         les zones non sûres sont compensées avec env(safe-area-inset-*) en CSS. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Gestion d'actions et de projets RUN/PROJET, mobile et desktop." />
    <meta name="theme-color" content="#0062cc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0068d1" media="(prefers-color-scheme: dark)" />
    <!-- Applique le thème choisi (Réglages) avant le premier rendu React :
         sans ça, une préférence "sombre" explicite flasherait en clair le
         temps que l'app charge. -->
    <script>
      try {
        var theme = localStorage.getItem("indxone-theme-preference");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (error) {}
    </script>
    <!-- Installation en app (Ajouter à l'écran d'accueil) sur iOS : Safari
         ignore le manifest web pour ce comportement, ces meta dédiées sont
         le seul moyen d'obtenir un lancement plein écran sans barre Safari. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Projets" />
    <title>INDXONE Projets</title>
    <link rel="icon" type="image/png" href="/icons/favicon-48.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
